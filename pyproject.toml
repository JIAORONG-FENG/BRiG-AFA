[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briga-afa"
version = "0.1.0"
description = "Bellman risk-to-go learning for non-myopic active feature acquisition"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Jiaorong Feng", email = "jiaorong.feng6838@gmail.com"},
  {name = "Qian Li", email = "qianli@curtin.edu.au"},
  {name = "Ying Li", email = "ying.li@curtin.edu.au"},
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.2",
  "torch>=2.0",
  "torchvision>=0.15",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["briga*"]
